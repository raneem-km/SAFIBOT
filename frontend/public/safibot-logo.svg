<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <defs>
    <!-- Outer light-to-mid green gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ac928"/>
      <stop offset="50%" stop-color="#70b32c"/>
      <stop offset="100%" stop-color="#1f7d38"/>
    </linearGradient>

    <!-- Deep green gradient for book and text -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#559f2c"/>
      <stop offset="35%" stop-color="#1b7235"/>
      <stop offset="100%" stop-color="#02431f"/>
    </linearGradient>

    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#116733"/>
      <stop offset="100%" stop-color="#034520"/>
    </linearGradient>

    <!-- Soft ambient shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Halo / Headband Arc -->
  <path d="M 215,360 A 200,200 0 1,1 585,360" 
        fill="none" 
        stroke="url(#limeGrad)" 
        stroke-width="38" 
        stroke-linecap="round"/>

  <!-- Inner Concentric Ring Accent -->
  <path d="M 270,360 A 145,145 0 0,1 530,360" 
        fill="none" 
        stroke="url(#limeGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        opacity="0.9"/>

  <!-- Mortarboard (Cap) -->
  <!-- Diamond Top -->
  <polygon points="400,165 525,230 400,295 275,230" fill="url(#limeGrad)"/>
  
  <!-- Cap Skull Base -->
  <path d="M 320,260 Q 400,295 480,260 L 480,285 Q 400,320 320,285 Z" fill="url(#limeGrad)"/>
  
  <!-- Tassel -->
  <polyline points="505,242 516,270 516,325" 
            fill="none" 
            stroke="url(#limeGrad)" 
            stroke-width="6" 
            stroke-linecap="round"/>
  <rect x="509" y="325" width="14" height="28" rx="4" fill="url(#limeGrad)"/>

  <!-- Robot Head & Face -->
  <!-- Main Face Body -->
  <rect x="300" y="315" width="200" height="150" rx="72" fill="url(#limeGrad)"/>
  
  <!-- Left Ear / Headphone Cup -->
  <rect x="255" y="340" width="36" height="85" rx="18" fill="url(#limeGrad)"/>
  
  <!-- Right Ear / Headphone Cup -->
  <rect x="509" y="340" width="36" height="85" rx="18" fill="url(#limeGrad)"/>

  <!-- Smiling Eyes -->
  <path d="M 330,400 A 24,24 0 0,1 380,400" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="14" 
        stroke-linecap="round"/>
  <path d="M 420,400 A 24,24 0 0,1 470,400" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="14" 
        stroke-linecap="round"/>

  <!-- Headset Microphone Boom & Mic -->
  <path d="M 522,410 C 532,490 470,520 440,518" 
        fill="none" 
        stroke="url(#limeGrad)" 
        stroke-width="16" 
        stroke-linecap="round"/>
  <rect x="408" y="504" width="35" height="28" rx="14" fill="url(#limeGrad)"/>

  <!-- Open Book Base -->
  <g id="open-book">
    <!-- Left Top Leaf -->
    <path d="M 400,600 C 340,555 270,545 218,555 C 228,580 270,600 375,640 Z" fill="url(#limeGrad)"/>
    <!-- Right Top Leaf -->
    <path d="M 400,600 C 460,555 530,545 582,555 C 572,580 530,600 425,640 Z" fill="url(#limeGrad)"/>

    <!-- Left Main Leaf -->
    <path d="M 400,612 C 330,570 260,575 230,622 C 265,635 340,650 400,705 Z" fill="url(#bookGrad)"/>
    <!-- Right Main Leaf -->
    <path d="M 400,612 C 470,570 540,575 570,622 C 535,635 460,650 400,705 Z" fill="url(#bookGrad)"/>
  </g>

  <!-- Typography: SAFIBOT -->
  <text x="400" y="785" 
        text-anchor="middle" 
        font-family="Montserrat, 'Arial Black', -apple-system, sans-serif" 
        font-weight="900" 
        font-size="94" 
        letter-spacing="5" 
        fill="url(#darkGrad)">SAFIBOT</text>
</svg>
